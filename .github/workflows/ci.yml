name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: lms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: lms
      DB_USER: postgres
      DB_PASSWORD: pass
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: testkey
      MINIO_SECRET_KEY: testsecret123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret123 \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not start" && exit 1

      - name: Apply the migrations
        run: |
          for file in migrations/*.up.sql; do
            PGPASSWORD=pass psql -h localhost -U postgres -d lms -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Format
        run: test -z "$(gofmt -l cmd internal pkg)" || (gofmt -l cmd internal pkg && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Swagger and Postman files are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          make postman
          git diff --exit-code -- docs || (echo "Run 'make postman' in backend/ and commit the result" && exit 1)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Types of the API are up to date
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || (echo "Run 'npm run api:types' in frontend/ and commit the result" && exit 1)

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the whole system
        working-directory: backend
        env:
          # the many sign-ups of the tests would meet the rate limits
          RATE_LIMIT_ENABLED: 'false'
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/courses >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 100
          echo "The system did not start" && exit 1

      - run: npm ci
        working-directory: frontend

      - name: Run the tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the screenshots and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Logs of the system
        if: failure()
        working-directory: backend
        run: docker compose logs --tail 200
