name: lms

# Local environment: docker compose up --build
#
# frontend   http://localhost:3000
# app        http://localhost:8080
# mailpit    http://localhost:8025   (all mails the app sends: password reset)
# minio      http://localhost:9001   (console, login: minioadmin / minioadmin)
#
# Values can be changed with an .env file next to this one or with the
# environment; the defaults below are for development only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations/ and exits; the app starts after it succeeded.
  migrate:
    image: migrate/migrate:v4.18.1
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-pass}@postgres:5432/${DB_NAME:-lms}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches the mails of the app instead of sending them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: dev
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_ENDPOINT: minio:9000
      # file links are for the browser, which reaches MinIO on the host port
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:${MINIO_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: lms
      MINIO_USE_SSL: "false"

      # the first SuperAdmin (dev only; the password is for the first login)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lms.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin-Passw0rd!2024}

      TOKEN_SECRET: ${TOKEN_SECRET:-dev-only-secret-change-me-0123456789abcdef}

      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@lms.local

      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      CERTIFICATE_VERIFY_URL: ${CERTIFICATE_VERIFY_URL:-http://localhost:8080/api/v1/certificates/verify}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # the container user cannot write next to the binary; logs go to stdout
      LOG_TO_FILE: "false"

  frontend:
    build: ../frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
