    type: object
  response.Success:
    properties:
      data: {}
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    REST API of the learning management system: courses, lessons, quizzes, certificates, payments and reports.
    Every answer is {"success": true, "data": ...} or {"success": false, "error": {"code", "message", "fields"}}.
    Log in with POST /auth/login, then click "Authorize" and enter: Bearer <access_token>.
  title: Learning Management System API
  version: "1.0"
paths:
  /attempts/{attemptId}:
    get:
      description: 'Access: any logged in user.'
      parameters:
      - description: Attempt id
        format: uuid
        in: path
        name: attemptId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
            - properties:
                data:
                  $ref: '#/definitions/models.AttemptDetail'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Failure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Failure'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Failure'
      security:
      - BearerAuth: []
      summary: Get an attempt
      tags:
      - Attempts
  /attempts/{attemptId}/submit:
    post:
      consumes:
      - application/json
      description: 'Access: Student.'
      parameters:
      - description: Attempt id
        format: uuid
        in: path
        name: attemptId
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.SubmitAttempt'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Success'
            - properties:
                data:
                  $ref: '#/definitions/models.AttemptResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Failure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Failure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Failure'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Failure'
      security:
      - BearerAuth: []
      summary: Submit the answers and get the score
      tags:
      - Attempts
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 'Access: anyone.'
      parameters:
